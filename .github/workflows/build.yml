name: Build VoicePad

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install customtkinter sounddevice soundfile numpy requests keyboard pyinstaller

      - name: Build exe
        run: pyinstaller --noconsole --onefile --name VoicePad --collect-all customtkinter --collect-all _sounddevice_data --collect-all _soundfile_data voicepad.py

      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - name: Save build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoicePad
          path: |
            dist/VoicePad.exe
            installer/VoicePad-Setup.exe

      - name: Attach files to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/VoicePad-Setup.exe
            dist/VoicePad.exe
