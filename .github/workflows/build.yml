name: Build VoicePad

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install customtkinter sounddevice soundfile numpy requests keyboard pyinstaller

      - name: Build exe
        run: pyinstaller --noconsole --onefile --name VoicePad --collect-all customtkinter --collect-all _sounddevice_data --collect-all _soundfile_data --icon voicepad.ico --add-data "voicepad.ico;." voicepad.py

      - name: Check that the exe has an embedded icon
        run: |
          python -c "import pefile; pe = pefile.PE('dist/VoicePad.exe'); ids = [e.id for e in pe.DIRECTORY_ENTRY_RESOURCE.entries]; print('resource types', ids); assert 14 in ids, 'icon is not embedded in the exe'"

      - name: Smoke test (run the built exe)
        shell: pwsh
        run: |
          $env:VOICEPAD_SMOKE = "$PWD\smoke.txt"
          $p = Start-Process -FilePath "dist\VoicePad.exe" -PassThru
          if (-not $p.WaitForExit(40000)) {
            $p.Kill()
            Write-Error "VoicePad did not exit in 40 s: it probably crashed and shows an error dialog"
            exit 1
          }
          if (-not (Test-Path smoke.txt)) { Write-Error "No smoke result: the app exited before the self-test"; exit 1 }
          $r = (Get-Content smoke.txt -Raw).Trim()
          Write-Host $r
          if ($r -ne "ok") { exit 1 }

      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - name: Save build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoicePad
          path: |
            dist/VoicePad.exe
            installer/VoicePad-Setup.exe

      - name: Attach files to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/VoicePad-Setup.exe
            dist/VoicePad.exe
